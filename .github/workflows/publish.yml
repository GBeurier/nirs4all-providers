name: Publish to PyPI

on:
  release:
    types: [published]
  # Manual runs are deliberately build-only. PyPI publication is reachable
  # exclusively from a non-prerelease GitHub Release `published` event.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    steps:
      - uses: actions/checkout@v7

      - name: Check out canonical ecosystem contracts
        uses: actions/checkout@v7
        with:
          repository: GBeurier/nirs4all-ecosystem
          ref: 5cfeeb10b73961d6be698b7f752d047bfd57300c
          path: nirs4all-ecosystem

      - name: Check out provider backings
        uses: actions/checkout@v7
        with:
          repository: GBeurier/nirs4all-datasets
          # v0.3.19 (tagged public release source)
          ref: 57ccd12fddbfb767b3ff5941433af5980f175c96
          path: nirs4all-datasets

      - uses: actions/checkout@v7
        with:
          repository: GBeurier/nirs4all-repository
          # v0.1.14 (public)
          ref: 2204ab18adac9648e27719f04c7c612983b57c6f
          path: nirs4all-repository

      - uses: actions/checkout@v7
        with:
          repository: GBeurier/nirs4all-formats
          ref: 819f5764a2138d755155e5018d7bbcb178924861 # v0.2.16
          path: nirs4all-formats

      - uses: actions/checkout@v7
        with:
          repository: GBeurier/nirs4all-io
          ref: 28e47c9d6491b83a31dd36a25f2b0a35eeab9860 # v0.3.1
          path: nirs4all-io

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install release gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install --only-binary=:all: \
            "nirs4all-datasets==0.3.19" \
            "nirs4all-repository==0.1.14" \
            "nirs4all-io==0.3.1" \
            "nirs4all-formats==0.2.16"
          python -m pip install "twine==7.0.0"

      - name: Verify release tag matches package version
        if: github.event_name == 'release' && github.event.release.prerelease == false
        run: python -m nirs4all_providers.version_sync --json

      - name: Run providers CI/release gate
        env:
          N4A_WORKSPACE_ROOT: ${{ github.workspace }}
        run: python scripts/ci_gate.py

      - name: Run installed backing release gate
        run: python -m nirs4all_providers.release_gate --json

      - name: Build sdist + wheel
        run: python -m build
      - name: Check both release distributions
        run: |
          set -euo pipefail
          mapfile -t wheels < <(compgen -G 'dist/*.whl')
          mapfile -t sdists < <(compgen -G 'dist/*.tar.gz')
          [[ ${#wheels[@]} -eq 1 ]] || { echo "::error::Expected exactly one wheel"; exit 1; }
          [[ ${#sdists[@]} -eq 1 ]] || { echo "::error::Expected exactly one sdist"; exit 1; }
          python -m twine check "${wheels[0]}" "${sdists[0]}"
      - name: Smoke-check the wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          nirs4all-providers-release-gate --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published' && github.event.release.draft == false && github.event.release.prerelease == false
    environment:
      name: pypi
      url: https://pypi.org/p/nirs4all-providers
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Require the exact release tag and valid distributions
        env:
          EXPECTED_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m nirs4all_providers.version_sync --expected-tag "${EXPECTED_RELEASE_TAG}" --json
          python -m pip install "twine==7.0.0"
          mapfile -t wheels < <(compgen -G 'dist/*.whl')
          mapfile -t sdists < <(compgen -G 'dist/*.tar.gz')
          [[ ${#wheels[@]} -eq 1 ]] || { echo "::error::Expected exactly one wheel"; exit 1; }
          [[ ${#sdists[@]} -eq 1 ]] || { echo "::error::Expected exactly one sdist"; exit 1; }
          python -m twine check "${wheels[0]}" "${sdists[0]}"
      - name: Validate Trusted Publisher release tuple
        run: |
          set -euo pipefail
          expected_repo="GBeurier/nirs4all-providers"
          if [[ "${GITHUB_REPOSITORY}" != "${expected_repo}" ]]; then
            echo "::error::PyPI Trusted Publisher for project nirs4all-providers must target owner=GBeurier repo=nirs4all-providers workflow=publish.yml environment=pypi; current repository is ${GITHUB_REPOSITORY}." >&2
            exit 1
          fi
          case "${GITHUB_WORKFLOW_REF}" in
            */.github/workflows/publish.yml@*)
              ;;
            *)
              echo "::error::Expected GITHUB_WORKFLOW_REF to point at .github/workflows/publish.yml, got ${GITHUB_WORKFLOW_REF}." >&2
              exit 1
              ;;
          esac
      - uses: pypa/gh-action-pypi-publish@release/v1
